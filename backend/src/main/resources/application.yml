server:
  port: ${PORT:8080}

spring:
  application:
    name: rhdp-canada
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rhdp}
    username: ${DATABASE_USERNAME:rhdp}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

rhdp:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
  demo-user:
    email: ${DEMO_USER_EMAIL:}
    password: ${DEMO_USER_PASSWORD:}
    display-name: ${DEMO_USER_DISPLAY_NAME:Membre démo}
